name: 🔄 Studio upstream sync
# Merges godotengine/godot `4.7` into `main` every night. The merge is built and
# tested on the `sync/upstream-4.7` branch first; `main` only fast-forwards when it is green.
# On conflicts, failures or a moved `main`, a single pull request is opened (or updated)
# instead, so `main` never breaks.
#
# Requires the repository secret STUDIO_SYNC_TOKEN: a token with `contents`, `pull-requests`
# and `workflows` write access. GITHUB_TOKEN cannot push commits that touch
# .github/workflows/, which upstream changes regularly.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: studio-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/godotengine/godot.git
  UPSTREAM_BRANCH: "4.7"
  SYNC_BRANCH: sync/upstream-4.7

jobs:
  merge:
    name: Merge upstream
    runs-on: ubuntu-22.04
    outputs:
      status: ${{ steps.merge.outputs.status }}
    steps:
      - name: Check token
        env:
          SYNC_TOKEN: ${{ secrets.STUDIO_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Repository secret STUDIO_SYNC_TOKEN is missing (needs contents, pull-requests and workflows write). See STUDIO.md."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.STUDIO_SYNC_TOKEN }}

      - name: Merge upstream into the sync branch
        id: merge
        env:
          GH_TOKEN: ${{ secrets.STUDIO_SYNC_TOKEN }}
        run: |
          git config user.name "studio-sync[bot]"
          git config user.email "studio-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          TARGET="upstream/$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "Already up to date."
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_or_update_pr() {
            # $1 = title, $2 = body file
            if [ -n "$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
              gh pr comment "$SYNC_BRANCH" --body-file "$2"
            else
              gh pr create --base main --head "$SYNC_BRANCH" --title "$1" --body-file "$2"
            fi
          }

          # The sync branch is owned by this workflow; it is rebuilt from main every run.
          git switch -C "$SYNC_BRANCH"
          if git merge --no-edit -m "Merge $TARGET into main" "$TARGET"; then
            git push --force origin "$SYNC_BRANCH"
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            # Publish the upstream tip so the PR shows the conflicts for manual resolution.
            git switch -C "$SYNC_BRANCH" "$TARGET"
            git push --force origin "$SYNC_BRANCH"
            {
              echo "Automatic merge of \`$TARGET\` into \`main\` hit conflicts in:"
              echo
              echo "$CONFLICTS" | sed 's/^/- `/; s/$/`/'
              echo
              echo "Resolve locally with \`misc/studio/sync_upstream.sh\` and re-check every file in \`STUDIO_HOOKS.md\`."
            } > pr_body.md
            open_or_update_pr "Upstream $UPSTREAM_BRANCH merge: conflicts" pr_body.md
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  verify:
    name: Build and test merge
    needs: merge
    if: needs.merge.outputs.status == 'merged'
    uses: ./.github/workflows/studio_ci.yml
    with:
      ref: sync/upstream-4.7

  publish:
    name: Fast-forward main
    needs: [merge, verify]
    if: always() && needs.merge.outputs.status == 'merged' && (needs.verify.result == 'success' || needs.verify.result == 'failure')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.STUDIO_SYNC_TOKEN }}

      - name: Fast-forward main, or open a PR
        env:
          GH_TOKEN: ${{ secrets.STUDIO_SYNC_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open_or_update_pr() {
            echo "$2" > pr_body.md
            if [ -n "$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
              gh pr comment "$SYNC_BRANCH" --body-file pr_body.md
            else
              gh pr create --base main --head "$SYNC_BRANCH" --title "$1" --body-file pr_body.md
            fi
          }

          if [ "${{ needs.verify.result }}" = "success" ]; then
            if git push origin "HEAD:main"; then
              exit 0
            fi
            open_or_update_pr "Upstream $UPSTREAM_BRANCH merge: main moved during CI" \
              "The upstream merge is green but \`main\` changed while it was being tested, so it could not be fast-forwarded. Merge this PR (or rerun the workflow). Run: $RUN_URL"
            exit 1
          fi
          open_or_update_pr "Upstream $UPSTREAM_BRANCH merge: build or tests failed" \
            "The merge of \`upstream/$UPSTREAM_BRANCH\` was clean but Studio CI failed. Run: $RUN_URL"
          exit 1
