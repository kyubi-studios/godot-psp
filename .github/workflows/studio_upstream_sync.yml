name: 🔄 Studio upstream sync
# Merges godotengine/godot `4.7` into `main` every night. The merge is built and
# tested on a `sync/upstream-*` branch first; `main` only fast-forwards when it is green.
# On conflicts or failures a pull request is opened instead, so `main` never breaks.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: studio-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/godotengine/godot.git
  UPSTREAM_BRANCH: "4.7"

jobs:
  merge:
    name: Merge upstream
    runs-on: ubuntu-22.04
    outputs:
      status: ${{ steps.merge.outputs.status }}
      branch: ${{ steps.merge.outputs.branch }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream into a sync branch
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "studio-sync[bot]"
          git config user.email "studio-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          TARGET="upstream/$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "Already up to date."
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="sync/upstream-${UPSTREAM_BRANCH}-${{ github.run_id }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git switch -c "$BRANCH"
          if git merge --no-edit -m "Merge $TARGET into main" "$TARGET"; then
            git push origin "$BRANCH"
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            # Push the upstream tip as-is so the PR shows the conflicts for manual resolution.
            git switch -C "$BRANCH" "$TARGET"
            git push origin "$BRANCH"
            {
              echo "Automatic merge of \`$TARGET\` into \`main\` hit conflicts in:"
              echo
              echo "$CONFLICTS" | sed 's/^/- `/; s/$/`/'
              echo
              echo "Resolve locally with \`misc/studio/sync_upstream.sh\` and check every file in \`STUDIO_HOOKS.md\`."
            } > pr_body.md
            gh pr create --base main --head "$BRANCH" --title "Upstream $UPSTREAM_BRANCH merge: conflicts" --body-file pr_body.md
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  verify:
    name: Build and test merge
    needs: merge
    if: needs.merge.outputs.status == 'merged'
    uses: ./.github/workflows/studio_ci.yml
    with:
      ref: ${{ needs.merge.outputs.branch }}

  publish:
    name: Fast-forward main
    needs: [merge, verify]
    if: always() && needs.merge.outputs.status == 'merged'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge.outputs.branch }}
          fetch-depth: 0

      - name: Fast-forward main, or open a PR on failure
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.merge.outputs.branch }}
        run: |
          if [ "${{ needs.verify.result }}" = "success" ]; then
            git push origin "HEAD:main"
            git push origin --delete "$BRANCH"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Upstream $UPSTREAM_BRANCH merge: build or tests failed" \
              --body "The merge of \`upstream/$UPSTREAM_BRANCH\` was clean but Studio CI failed. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            exit 1
          fi
